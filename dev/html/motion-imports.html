<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Motion animate + scroll</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #0e0e10;
                color: #fff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, Helvetica, Arial, sans-serif;
            }
            #progress {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 6px;
                background: #0077ff;
                transform-origin: 0 50%;
                transform: scaleX(0);
                z-index: 1;
            }
            header,
            section {
                min-height: 100vh;
                padding: 48px 32px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
            }
            h1 {
                margin: 0;
                font-size: 22px;
            }
            code {
                color: #9a9aa2;
            }
            button {
                appearance: none;
                border: 1px solid #2e2e34;
                background: #1a1a1f;
                color: #fff;
                border-radius: 8px;
                padding: 9px 16px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
            }
            #box {
                width: 100px;
                height: 100px;
                border-radius: 16px;
                background: #ff0088;
            }
            .card {
                width: min(400px, 100%);
                height: 200px;
                border-radius: 16px;
                background: #1a1a1f;
                border: 1px solid #2e2e34;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
            }
            output {
                font-variant-numeric: tabular-nums;
                color: #9a9aa2;
            }
        </style>
    </head>
    <body>
        <div id="progress"></div>
        <header>
            <h1>animate() + scroll()</h1>
            <code>import { animate, scroll } from "motion"</code>
            <div id="box"></div>
            <button id="play">Animate box</button>
            <output id="status">Scroll progress: 0.00</output>
        </header>
        <section><div class="card">Card 1</div></section>
        <section><div class="card">Card 2</div></section>
        <section><div class="card">Card 3</div></section>
        <script type="module" src="/src/motion-imports.js"></script>
    </body>
</html>
